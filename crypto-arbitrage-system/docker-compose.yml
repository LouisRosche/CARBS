version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: arbitrage_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbitrage}
      POSTGRES_USER: ${POSTGRES_USER:-arbitrage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arbitrage_user} -d ${POSTGRES_DB:-arbitrage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arbitrage_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arbitrage_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - arbitrage_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: arbitrage_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - arbitrage_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: arbitrage_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - arbitrage_network
    restart: unless-stopped

  # Database backup service - runs daily backups
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: arbitrage_db_backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-arbitrage}
      POSTGRES_USER: ${POSTGRES_USER:-arbitrage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z6 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - arbitrage_network
    restart: unless-stopped

  # Redis backup service - periodic RDB snapshots
  redis-backup:
    image: redis:7-alpine
    container_name: arbitrage_redis_backup
    entrypoint: /bin/sh
    command: >
      -c 'while true; do
        echo "Starting Redis backup at $$(date)";
        redis-cli -h redis -a $${REDIS_PASSWORD} BGSAVE;
        sleep 5;
        cp /data/dump.rdb /backups/redis-$$(date +%Y%m%d-%H%M%S).rdb;
        find /backups -name "redis-*.rdb" -mtime +7 -delete;
        echo "Backup complete, sleeping for 6 hours";
        sleep 21600;
      done'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data:ro
      - ./backups/redis:/backups
    depends_on:
      - redis
    networks:
      - arbitrage_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  arbitrage_network:
    driver: bridge
