[project]
name = "crypto-arbitrage-system"
version = "1.0.0"
description = "Production-grade cryptocurrency arbitrage detection and execution platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CARBS Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "aiofiles==23.2.1",
    "ccxt==4.2.25",
    "ccxtpro==4.2.25",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "redis==5.0.1",
    "hiredis==2.3.2",
    "pandas==2.2.0",
    "numpy==1.26.3",
    "scipy==1.11.4",
    "prometheus-client==0.19.0",
    "aiohttp==3.9.1",
    "cryptography==41.0.7",
    "PyJWT==2.8.0",
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.5.3",
    "rich==13.7.0",
    "python-telegram-bot==20.7",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "black==23.12.1",
    "flake8==7.0.0",
    "mypy==1.8.0",
    "isort==5.13.2",
    "ipython==8.20.0",
    "pre-commit==3.6.0",
    "bandit==1.7.7",
    "safety==2.3.5",
]

test = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
]

[project.scripts]
carbs = "src.cli.commands:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 50

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
