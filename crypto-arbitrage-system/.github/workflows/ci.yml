name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy

      - name: Check formatting with Black
        run: black --check src/ tests/

      - name: Check import sorting with isort
        run: isort --check-only src/ tests/

      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-redis types-PyYAML types-aiofiles

      - name: Type check with mypy
        run: |
          echo "Running mypy type checking..."
          mypy src/ --ignore-missing-imports --no-error-summary > mypy-output.txt 2>&1 || MYPY_EXIT=$?

          if [ -n "$MYPY_EXIT" ] && [ "$MYPY_EXIT" -ne 0 ]; then
            echo "::warning::⚠️ Mypy found type errors"
            cat mypy-output.txt
          else
            echo "✅ No type errors found"
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: arbitrage
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: arbitrage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: arbitrage
          DB_PASSWORD: testpassword
          DB_NAME: arbitrage_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run bandit security scan
        run: |
          echo "Running Bandit security scan..."
          bandit -r src/ -ll --skip B101 > bandit-output.txt 2>&1 || BANDIT_EXIT=$?

          if [ -n "$BANDIT_EXIT" ] && [ "$BANDIT_EXIT" -ne 0 ]; then
            echo "::warning::⚠️ Bandit detected potential security issues"
            cat bandit-output.txt
          else
            echo "✅ No security issues found by Bandit"
            cat bandit-output.txt
          fi

      - name: Check for vulnerable dependencies
        run: |
          echo "Checking for vulnerable dependencies..."
          safety check -r requirements.txt --full-report > safety-output.txt 2>&1 || SAFETY_EXIT=$?

          if [ -n "$SAFETY_EXIT" ] && [ "$SAFETY_EXIT" -ne 0 ]; then
            echo "::warning::⚠️ Safety detected vulnerable dependencies"
            cat safety-output.txt
          else
            echo "✅ No vulnerable dependencies found"
          fi
